name: Hermes Lite (gate)

# [HERMES-REFRESH] Gate « fraîcheur exigée au merge ».
# La logique complète vit dans .github/hermes/gate.py (stdlib seule).
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Numéro de PR spécifique (vide = toutes les PR ouvertes)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  checks: write

concurrency:
  # Un groupe PAR PR (et par ref pour workflow_dispatch), pas un groupe par dépôt :
  # avec `hermes-lite-${{ github.repository }}`, deux PR (ou une PR + les refs
  # `mergify/merge-queue/*` de la file) s'annulaient mutuellement. Un check annulé
  # est compté comme rouge par Mergify : la file déquait la PR à chaque passage
  # (« Canceling since a higher priority waiting request … exists »).
  group: hermes-lite-${{ github.event.pull_request.number || github.event.inputs.pr_number || github.ref }}
  # Jamais d'annulation en cours de route : un gate interrompu n'est pas un gate vert.
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.HERMES_LITE_TOKEN || github.token }}
  # [HERMES-AGENT] Conflit -> chat ZeroClaw (daemon sur la machine du runner, même
  # utilisateur). Le job ne fait que lancer : il reste sous les 5 min de `ci-budget`.
  HERMES_AGENT_RESOLVE: ${{ vars.HERMES_AGENT_RESOLVE || '1' }}
  HERMES_ZC_URL: ${{ vars.HERMES_ZC_URL || 'http://127.0.0.1:42617' }}
  HERMES_ZC_AGENT: ${{ vars.HERMES_ZC_AGENT || 'hermes' }}
  HERMES_ZC_TOKEN_FILE: ${{ vars.HERMES_ZC_TOKEN_FILE || '~/.config/zeroclaw-serveur/token' }}
  HERMES_AGENT_TIMEOUT: ${{ vars.HERMES_AGENT_TIMEOUT || '1500' }}
  # IMPORTANT (runbook §3) : à renseigner PAR DÉPÔT — contexts de statut requis
  # avant merge, séparés par des virgules. Vide = merge dès que la PR est fraîche.
  HERMES_REQUIRED_CHECKS: ''
  MERGE_METHOD: rebase

jobs:
  gate:
    name: Verdict
    runs-on: [self-hosted, sam-vision-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Gate
        run: |
          export INPUT_PR_NUMBER="${{ github.event.inputs.pr_number }}"
          export HERMES_LITE_DRY_RUN="${{ vars.HERMES_LITE_DRY_RUN || '0' }}"
          python3 .github/hermes/gate.py
