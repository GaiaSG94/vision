name: CI

# Budget : 5 min maximum (règle projet — ~/Bureau/CI-BUDGET-5MIN.md).
# Worker = r630 (Dell), JDK 17 + Android SDK préinstallés ; JAVA_HOME/ANDROID_HOME
# viennent du .env du runner. Cache Gradle persistant sur la machine.
# Pas de `paths-ignore` : `ci` est exigé par la file Mergify, donc il doit
# exister sur TOUTES les PR (sinon la PR resterait bloquée en attente de check).
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # La détection « PR sans code » lit la liste des fichiers via l'API.
  pull-requests: read

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, sam-vision-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Cette PR touche-t-elle du code ?
        id: perimetre
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # Une PR de docs/config n'a pas besoin de Gradle : on économise ~45 s
          # de CI et le verdict tombe en quelques secondes. La liste des fichiers
          # vient de l'API (le checkout est superficiel, la base n'y est pas).
          # Même règle pour un push sur master : sinon chaque push relançait le
          # build complet (39–49 s mesurés) et faisait bouger la base sous les
          # PR en file (rebase + re-test de tout le monde).
          code=1
          fichiers=""
          if [ -n "$PR_NUMBER" ]; then
            fichiers="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              | python3 -c 'import json,sys;print("\n".join(f["filename"] for f in json.load(sys.stdin)))' 2>/dev/null || true)"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # Push : compare de l'avant au sommet poussé (robuste aux pushes
            # multi-commits, contrairement a `git show HEAD`).
            fichiers="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/compare/$PUSH_BEFORE...$PUSH_SHA" \
              | python3 -c 'import json,sys;print("\n".join(f["filename"] for f in json.load(sys.stdin).get("files") or []))' 2>/dev/null || true)"
          fi
          # Périmètre « code » : les modules Kotlin (app, core), le spike lunettes
          # (glasses-spike/, sous toutes ses formes : .kt, .kts, res, manifest),
          # la chaîne d'outils (gradle/, gradle.properties, settings.gradle.kts —
          # c'est là que le module est déclaré) et tools/ (les gardes y jouent le
          # rôle d'un build). Avant : une PR qui ne touchait que glasses-spike/
          # ou settings.gradle.kts était classée « sans code » et Gradle ne
          # lançait jamais le module — vert par absence de test.
          if [ -n "$fichiers" ]; then
            if printf '%s\n' "$fichiers" | grep -qE '^(app|core)/.*\.(kt|kts)$|^glasses-spike/|^gradle/|^gradle\.properties$|^settings\.gradle\.kts$|^tools/'; then
              code=1; echo "Code touché : Gradle complet."
            else
              code=0; echo "Sans code (${fichiers//$'\n'/, }) : étapes Gradle sautées."
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Chaîne d'outils du worker
        run: |
          test -n "$JAVA_HOME" || { echo "::error::JAVA_HOME absent — voir ~/toolchains/jdk17 sur le r630"; exit 1; }
          test -n "$ANDROID_HOME" || { echo "::error::ANDROID_HOME absent — voir ~/android-sdk sur le r630"; exit 1; }
          "$JAVA_HOME/bin/java" -version
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: Aucun secret ni fichier local dans le dépôt
        run: |
          # Régression déjà vue sur ce projet : des clés API en clair dans un
          # fichier de config. Ici on refuse tout ajout de ce genre.
          if git ls-files --error-unmatch local.properties >/dev/null 2>&1; then
            echo "::error::local.properties ne doit jamais être versionné (clés API)"; exit 1
          fi
          if git grep -nEI 'sk-[A-Za-z0-9_-]{24,}|sk_[a-f0-9]{32}|ghp_[A-Za-z0-9]{36}' -- . ':!.github' ':!docs' ':!*.md'; then
            echo "::error::clé API en clair détectée ci-dessus"; exit 1
          fi
          echo "OK — aucun secret versionné"

      - name: Anti-régression — pas de java.home codé en dur
        run: |
          # Déjà vu : org.gradle.java.home en dur dans gradle.properties casse
          # le build sur le worker (chemin inexistant). La chaîne d'outils vient
          # de l'environnement du runner, jamais du dépôt.
          if grep -E '^[[:space:]]*org\.gradle\.java\.home' gradle.properties; then
            echo "::error::org.gradle.java.home ne doit pas être fixé dans gradle.properties (voir ~/.gradle/gradle.properties du poste)"; exit 1
          fi
          echo "OK — java.home non codé en dur"

      - name: Garde de taille Kotlin (< 500 lignes/fichier, < 50 lignes/fonction)
        run: python3 tools/check-kotlin-limits.py

      # Un SEUL appel Gradle (une seule configuration, un seul daemon) :
      # tests + APK debug + APK release + lint + spike lunettes. Mesuré sur
      # r630-sam-vision-0N le 24/10 : 46 s à chaud, 1 min 00 en CI — budget 5 min.
      # Le spike ajoute ~18-33 s à chaud (:glasses-spike:assembleDebug 15-25 s,
      # 7 .kt Compose + ~11 Mo de .so META à empaqueter ; :testDebugUnitTest
      # 3-8 s). Premier run = 11 Mo d'AAR mwdat à télécharger, mesuré sur le
      # r630 : 8,9 Mo en 0,53 s (~17 Mo/s) → 2-5 s, une seule fois par worker
      # (GRADLE_USER_HOME persistant sur la machine, pas d'actions/cache).
      # Total estimé : ~1 min 15 à chaud, ~1 min 45 au pire premier run → sous
      # les 5 min : le timeout de `ci` reste à 5 et la gate exigée par Mergify
      # continue de couvrir le module (un job séparé doublerait checkout + conf).
      # Estimation détaillée : docs/glasses-spike-ci.md.
      # -Xmx2g : 4 workers partagent la machine (31 Go), 4 daemons à 4 Go
      # saturated la RAM.
      - name: Tests + APK debug + APK release + lint + spike lunettes
        if: steps.perimetre.outputs.code == '1'
        run: >-
          ./gradlew --console=plain -Dorg.gradle.jvmargs="-Xmx2g"
          :core:testDebugUnitTest :app:testDebugUnitTest
          :app:assembleDebug :app:assembleRelease :app:lintDebug
          :glasses-spike:assembleDebug :glasses-spike:testDebugUnitTest

      # L'APK du téléphone, publié à chaque push sur master : `phone-live-build` le
      # télécharge et l'installe. Jamais sur les PR (76 Mo par course, sans usage).
      - name: APK debug sur master
        if: github.ref == 'refs/heads/master' && steps.perimetre.outputs.code == '1'
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 2
          if-no-files-found: error

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-et-lint
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
          retention-days: 3
          if-no-files-found: ignore