name: couche0

# Couche 0 anti-régression (portée de BaptisteFaisy/duello, demande user
# 2026-10-08). Deux contrôles déterministes, quasi gratuits, sans checkout :
#   - scope     : tout fichier modifié est déclaré dans `## Scope` du corps ;
#   - forbidden : motifs interdits dans le diff + fichiers de garde gelés.
# Le juge vient de `master`, jamais du head de la PR : une PR ne modifie pas
# son propre garde. Re-armable : `gh workflow run couche0.yml -f pr=<n>`.
# Démarrage INFORMATIF (comme duello) : le check n'est exigé ni par la
# protection de branche ni par la file Mergify tant qu'il n'est pas calibré.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: "Numéro de PR à contrôler"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

# Les PR-brouillon du batch Mergify (refs `mergify/*`) n'ont pas de corps
# rédigé : la Couche 0 y serait toujours rouge et bloquerait la file (constaté
# le 24/10 : `action.queue.leave CHECKS_FAILED`). Elle n'y a rien à contrôler —
# la vraie PR a déjà été passée au crible avant l'embarquement. Même traitement
# que le gate Hermes de duello, qui ignore les refs mergify/*.
concurrency:
  group: couche0-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  couche0:
    name: couche0
    if: ${{ !startsWith(github.head_ref, 'mergify/') }}
    runs-on: [self-hosted, sam-vision-worker]
    timeout-minutes: 5
    steps:
      - name: Récupérer le garde depuis master, puis contrôler la PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [ -n "$PR_NUMBER" ] || { echo "::error::aucun numéro de PR"; exit 1; }
          GARDE="$RUNNER_TEMP/check_couche0.py"
          recuperer() {
            curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.raw" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/.github/couche0/check_couche0.py?ref=$1" \
              -o "$GARDE"
          }
          recuperer master || {
            echo "::warning::garde absent de master — repli sur le head de la PR (premier atterrissage)"
            recuperer "$HEAD_SHA"
          }
          python3 "$GARDE" check --pr "$PR_NUMBER"