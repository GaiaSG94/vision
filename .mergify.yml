# File de merge Mergify — socle CI self-hosted (R630).
#
# Le depot demarre sans gate IA ni batterie de tests : les queue_conditions
# n'exigent donc aucun check inexistant (le socle CI est en dry-run —
# variable de depot HERMES_LITE_DRY_RUN=1). Le seul check exige est
# `ci-budget`, livre par le socle : aucune PR ne peut entrer dans la file
# avec un job declare a plus de 5 minutes. Quand la CI reelle du depot
# existera, ajouter dans queue_conditions :
#   - check-success = "<check reel>"
# Fait le 2026-10-24 : check reel `ci` ajoute, plus le frein `hold`.
# Structure copiée du .mergify.yml de BaptisteFaisy/duello (décision
# user 2026-10-10) : inline labels urgent / priority-low identiques.
queue_rules:
  - name: default
    queue_conditions:
      # Budget CI 5 min (règle user 2026-10-24) : le garde-fou du socle.
      - check-success = ci-budget
      # CI reelle du depot (tests core+app, APK debug, garde anti-secret).
      - check-success = ci
      # Couche 0 (portée de duello) : opposable depuis le 24/10 — calibrée le
      # jour de son arrivée, zéro faux positif sur 6 PR (#4 à #14, dont 2 PR
      # d'un autre agent). Elle refuse tout fichier hors `## Scope` : c'est
      # exactement « une modif non demandée n'est jamais prise en compte ».
      - check-success = couche0
      # Frein manuel : etiqueter `hold` sort la PR de la file.
      - -label = hold
      - -conflict
      - -draft
      - base = master
    batch_size:
      min: 1
      max: 2
    # Ne pas attendre 30 s pour remplir un batch : la file teste en speculatif
    # (max_parallel_checks), l'attente ne sert qu'à perdre du temps.
    batch_max_wait_time: "5 seconds"
    max_checks_retries: 1
    # Évaluées sur la DRAFT PR du batch (doc Mergify), pas sur la PR d'origine :
    # on n'y met que les checks publiés partout. `ci` (gradle) devient `pending`
    # sur les refs mergify/* et bloquerait le merge du batch — la qualité reste
    # garantie par les queue_conditions, évaluées sur la vraie PR après rebase
    # (update_method: rebase relance la CI).
    merge_conditions:
      - check-success = ci-budget
      - check-success = stale-base-guard
    merge_method: rebase
    update_method: rebase

priority_rules:
  - name: urgent
    conditions:
      - label = urgent
    priority: high
  - name: priority-low
    conditions:
      - label = priority-low
    priority: low

merge_queue:
  # 4 workers self-hosted sur le r630 (labels sam-vision-worker) : Mergify teste
  # autant de lots en parallèle qu'il y a de workers (spéculation).
  max_parallel_checks: 4

# Auto-queue natif (produit Merge Queue) : évite de dépendre du produit
# « Workflow Automation » (pull_request_rules), constaté désactivé le 24/10.
merge_protections:
  # Règles évaluées par le produit « Merge Protections » (à activer dans le
  # dashboard : sans lui, auto_merge_conditions reste sans effet et la file
  # n'embarque que sur @Mergifyio queue — doc /merge-protections/setup).
  # Volontairement identiques aux conditions de file : pas de double garde.
  # `couche0` est exigée depuis le 24/10 (voir queue_conditions).
  - name: CI verte et pas de hold
    description: "Ce qui doit passer avant d'entrer dans la file."
    if:
      - base = master
    success_conditions:
      - check-success = ci
      - check-success = ci-budget
      - check-success = couche0
      - -label = hold

merge_protections_settings:
  auto_merge_conditions: true
